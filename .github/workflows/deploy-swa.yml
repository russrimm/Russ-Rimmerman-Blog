name: Deploy to Azure Static Web Apps

# Shared deploy path for both the push/PR pipeline and the publish-post workflow.
# The caller is responsible for building the site and uploading it as the
# `site-dist` artifact, so the site is only ever built once per run.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check out for the API source.
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site-dist
          path: dist

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          SWA_NAME: ${{ vars.SWA_NAME || 'russrimmerman-blog' }}
          SWA_RESOURCE_GROUP: ${{ vars.SWA_RESOURCE_GROUP || 'russrimmerman-blog-rg' }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
