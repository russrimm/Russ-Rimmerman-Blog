name: Publish or unpublish a post

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Post slug, matching the filename without extension (for example: starting-a-new-blog)"
        type: string
        required: true
      state:
        description: "Take the post live, or pull it back to draft"
        type: choice
        required: true
        default: live
        options:
          - live
          - draft

concurrency:
  group: publish-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update draft flag
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set draft flag
        run: node scripts/set-draft.mjs --slug "$SLUG" --draft "$DRAFT"
        env:
          SLUG: ${{ inputs.slug }}
          DRAFT: ${{ inputs.state == 'draft' }}

      - name: Install site dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Check API syntax
        run: node --check api/src/functions/subscribe.js

      # Publishing makes a previously unbuilt post part of the site, so the full
      # CI gate runs before the commit lands rather than after.
      - name: Build and test
        run: npm test

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet -- src/content/blog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No frontmatter change to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "Set $SLUG to $STATE" -m "Toggled via the publish-post workflow."
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          SLUG: ${{ inputs.slug }}
          STATE: ${{ inputs.state }}

      - name: Summarize post states
        if: always()
        run: |
          {
            echo "### Blog post states"
            echo ""
            echo '```'
            node scripts/set-draft.mjs --list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    name: Deploy
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-swa.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit
