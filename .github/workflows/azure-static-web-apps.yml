name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Validate site
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Check API syntax
        run: node --check api/src/functions/subscribe.js

      - name: Build and test
        run: npm test

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build_and_deploy:
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Deploy
    # Shared with close_pull_request so a merge cannot race an in-flight deploy
    # and leave an orphaned staging environment behind.
    concurrency:
      group: swa-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site-dist
          path: dist

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          SWA_NAME: ${{ vars.SWA_NAME || 'russrimmerman-blog' }}
          SWA_RESOURCE_GROUP: ${{ vars.SWA_RESOURCE_GROUP || 'russrimmerman-blog-rg' }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request
    concurrency:
      group: swa-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          SWA_NAME: ${{ vars.SWA_NAME || 'russrimmerman-blog' }}
          SWA_RESOURCE_GROUP: ${{ vars.SWA_RESOURCE_GROUP || 'russrimmerman-blog-rg' }}

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          action: close

      # The close action exits 0 even when it finds nothing to delete, so verify
      # the environment is actually gone and remove it by PR number if not.
      - name: Verify staging environment removal
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR number is empty; refusing to run environment delete."
            exit 1
          fi
          if show_error=$(az staticwebapp environment show \
              --name "$SWA_NAME" \
              --resource-group "$SWA_RESOURCE_GROUP" \
              --environment-name "$PR_NUMBER" -o none 2>&1); then
            echo "Staging environment '$PR_NUMBER' still exists. Deleting it."
            az staticwebapp environment delete \
              --name "$SWA_NAME" \
              --resource-group "$SWA_RESOURCE_GROUP" \
              --environment-name "$PR_NUMBER" \
              --yes
            echo "Deleted staging environment '$PR_NUMBER'."
          elif grep -qi 'NotFound' <<<"$show_error"; then
            echo "No staging environment named '$PR_NUMBER' remains. Nothing to clean up."
          else
            echo "::error::Could not determine the state of staging environment '$PR_NUMBER'."
            echo "$show_error"
            exit 1
          fi
        env:
          SWA_NAME: ${{ vars.SWA_NAME || 'russrimmerman-blog' }}
          SWA_RESOURCE_GROUP: ${{ vars.SWA_RESOURCE_GROUP || 'russrimmerman-blog-rg' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
