name: Generate hero images

# Auto-generates a topic-aware hero image for any blog post pushed to `main`
# without a `heroImage`, then commits the WebP + frontmatter back to the repo.
#
# Auth is Microsoft Entra ID via OIDC (federated credential) — there is NO API
# key and NO long-lived secret. It reuses the same identity as the deploy
# workflow; that identity additionally needs the "Cognitive Services OpenAI
# User" role on the Azure OpenAI resource. Endpoint + deployments are non-secret
# repo *variables* (Settings → Secrets and variables → Actions → Variables):
#   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_IMAGE_DEPLOYMENT, AZURE_OPENAI_CHAT_DEPLOYMENT
# and the same identity secrets as deploy:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# AZURE_OPENAI_CHAT_DEPLOYMENT is optional here: without it the generator falls
# back to the static topic map and scenes are less content-specific. It reads a
# repo *secret* of the same name as a fallback, because this repo still carries
# one from before these values moved to variables.
#
# See "Auto-generating blog hero images" in README.md.

on:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Regenerate one or more posts by slug (space- or comma-separated, e.g. 'post-a post-b'). Overrides regenerate_all."
        type: string
        default: ""
      style:
        description: "Prompt style. 'presenter' = author at whiteboard (current default). 'content' = subject-matter illustration only, no author, no headshot, no training room."
        type: choice
        default: presenter
        options:
          - presenter
          - content
      include_drafts:
        description: "Also generate images for draft posts"
        type: boolean
        default: false
      regenerate_all:
        description: "Regenerate hero images for ALL posts (overwrites existing)"
        type: boolean
        default: false

# Never run two generation jobs at once (they both commit to main).
concurrency:
  group: generate-hero-images
  cancel-in-progress: false

permissions:
  contents: write # commit generated images back to the repo
  id-token: write # obtain the Entra ID OIDC token

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Entra app's federated identity credential trusts only
      # refs/heads/main, so Azure OIDC login fails on any other ref. Fail
      # fast with a clear message instead of burning ~90s on a login error.
      - name: Guard against non-main dispatches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow can only run against the 'main' branch."
          echo "::error::The Azure federated identity credential is scoped to refs/heads/main."
          echo "::error::Re-run 'Generate hero images' with 'Use workflow from' set to 'main'."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Federated OIDC login — no secrets, just the identity's client/tenant IDs.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate hero images
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_IMAGE_DEPLOYMENT: ${{ vars.AZURE_OPENAI_IMAGE_DEPLOYMENT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT || secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
        run: |
          extra_args=""
          if [ "${{ github.event.inputs.include_drafts }}" = "true" ]; then
            extra_args="--include-drafts"
          fi

          style_input="${{ github.event.inputs.style }}"
          if [ "$style_input" = "content" ]; then
            extra_args="$extra_args --content-only"
          fi

          slug_input="${{ github.event.inputs.slug }}"
          if [ -n "$slug_input" ]; then
            # Accept comma- or whitespace-separated slugs; normalize to spaces.
            slugs=$(echo "$slug_input" | tr ',' ' ' | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')
            echo "Regenerating hero image(s) for: $slugs (style=$style_input)"
            # shellcheck disable=SC2086
            npm run hero -- $slugs --force $extra_args
          elif [ "${{ github.event.inputs.regenerate_all }}" = "true" ]; then
            # Regenerate every post (filter out drafts unless include_drafts=true,
            # since positional slugs bypass the script's built-in draft filter).
            include_drafts="${{ github.event.inputs.include_drafts }}"
            slugs=""
            while IFS= read -r file; do
              if [ "$include_drafts" != "true" ] && grep -qE '^draft:\s*true\s*$' "$file"; then
                echo "Skipping draft: $file"
                continue
              fi
              slug=$(basename "$file")
              slugs="$slugs ${slug%.*}"
            done < <(find src/content/blog -maxdepth 1 -type f \( -name '*.mdx' -o -name '*.md' \) | sort)
            if [ -z "$slugs" ]; then
              echo "No blog posts to regenerate."; exit 0
            fi
            echo "Regenerating hero images for:$slugs (style=$style_input)"
            # shellcheck disable=SC2086
            npm run hero -- $slugs --force $extra_args
          else
            npm run hero -- --missing $extra_args
          fi

      - name: Commit generated images
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if [ "${{ github.event.inputs.regenerate_all }}" = "true" ]; then
              git commit -m "chore: regenerate all hero images (style=${{ github.event.inputs.style }}) [skip ci]"
            elif [ -n "${{ github.event.inputs.slug }}" ]; then
              git commit -m "chore: regenerate hero image(s) for ${{ github.event.inputs.slug }} (style=${{ github.event.inputs.style }}) [skip ci]"
            else
              git commit -m "chore: auto-generate hero images for new posts [skip ci]"
            fi
            git push
          else
            echo "No new hero images to commit."
          fi
