name: Publish scheduled posts

# Publishes any draft whose pubDate has arrived. Set the date in frontmatter,
# leave `draft: true`, and the post goes live on its own.
on:
  schedule:
    - cron: "0 11 * * *" # 06:00 America/Chicago (CDT) / 05:00 (CST)
  workflow_dispatch:

concurrency:
  group: publish-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    name: Publish due posts
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Publish posts whose pubDate has arrived
        run: node scripts/set-draft.mjs --publish-due

      - name: Stop early when nothing is due
        id: due
        run: |
          if git diff --quiet -- src/content/blog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install site dependencies
        if: steps.due.outputs.changed == 'true'
        run: npm ci

      - name: Install API dependencies
        if: steps.due.outputs.changed == 'true'
        run: npm ci --prefix api

      - name: Check API syntax
        if: steps.due.outputs.changed == 'true'
        run: node --check api/src/functions/subscribe.js

      - name: Build and test
        if: steps.due.outputs.changed == 'true'
        run: npm test

      - name: Upload site artifact
        if: steps.due.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Commit and push
        id: commit
        if: steps.due.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "Publish posts scheduled for today" -m "Published automatically from pubDate."
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarize post states
        if: always()
        run: |
          {
            echo "### Blog post states"
            echo ""
            echo '```'
            node scripts/set-draft.mjs --list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    name: Deploy
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/deploy-swa.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit
