<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 430"
  class="sd-root"
  role="img"
  aria-labelledby="ctDestTitle ctDestDesc"
>
  <title id="ctDestTitle">
    Destination choice, and what it does to the running cost
  </title>
  <desc id="ctDestDesc">
    Compare destinations without assuming a fixed price ranking. Blob or Azure
    Data Lake Storage needs storage, transaction, transformation, and reporting
    costs. Fabric needs compute headroom and storage; an existing capacity does
    not make additional work free. Azure SQL, Azure Data Explorer, and Fabric
    Eventhouse have different compute, storage, and query billing models.
    Include private connectivity, monitoring, reporting licenses, and any
    required gateway in the full estimate.
  </desc>

  <text x="12" y="26" font-size="19" font-weight="700" class="sd-title">
    Budget the destination and the reporting path
  </text>
  <text x="12" y="50" font-size="13" class="sd-muted">
    Estimate the actual configuration. Existing resources still need headroom.
  </text>

  <!-- Object storage -->
  <g class="sd-green">
    <rect
      x="12"
      y="76"
      width="238"
      height="182"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="30" y="102" font-size="14" font-weight="700" class="sd-fill">
      Blob or Data Lake Storage
    </text>
    <text x="30" y="124" font-size="13" font-weight="700" class="sd-body">
      Storage-based estimate
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="30" y="150">No Fabric capacity required</tspan>
      <tspan x="30" y="170">Power BI Pro scheduled import</tspan>
      <tspan x="30" y="190">Storage and transactions billed</tspan>
    </text>
    <text font-size="12" class="sd-muted">
      <tspan x="30" y="216">Include transformations and</tspan>
      <tspan x="30" y="234">the refresh network path</tspan>
    </text>
  </g>

  <!-- Fabric -->
  <g class="sd-amber">
    <rect
      x="261"
      y="76"
      width="238"
      height="182"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="279" y="102" font-size="14" font-weight="700" class="sd-fill">
      Fabric Lakehouse
    </text>
    <text x="279" y="124" font-size="13" font-weight="700" class="sd-body">
      Capacity plus storage
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="279" y="150">Check spare compute headroom</tspan>
      <tspan x="279" y="170">Budget stored copies and queries</tspan>
    </text>
    <text font-size="12" class="sd-muted">
      <tspan x="279" y="196">Link to Fabric also consumes</tspan>
      <tspan x="279" y="214">additional Dataverse storage</tspan>
      <tspan x="279" y="232">for its optimized replica</tspan>
    </text>
  </g>

  <!-- Database services -->
  <g class="sd-red">
    <rect
      x="510"
      y="76"
      width="238"
      height="182"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="528" y="102" font-size="14" font-weight="700" class="sd-fill">
      Database or analytics store
    </text>
    <text x="528" y="124" font-size="13" font-weight="700" class="sd-body">
      Service-specific estimate
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="528" y="150">Azure SQL, Data Explorer, and</tspan>
      <tspan x="528" y="170">Fabric Eventhouse each have</tspan>
      <tspan x="528" y="190">different billing models</tspan>
    </text>
    <text font-size="12" class="sd-muted">
      <tspan x="528" y="216">Price compute, storage,</tspan>
      <tspan x="528" y="234">ingestion, and queries</tspan>
    </text>
  </g>

  <!-- Hidden costs -->
  <g class="sd-purple">
    <rect
      x="12"
      y="280"
      width="736"
      height="136"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="32" y="306" font-size="14" font-weight="700" class="sd-fill">
      Include networking, operations, and Power BI licenses
    </text>
    <rect
      x="32"
      y="318"
      width="344"
      height="82"
      rx="8"
      class="sd-card"
      stroke-width="1"
    ></rect>
    <text x="48" y="342" font-size="13" font-weight="700" class="sd-body">
      Private connectivity
    </text>
    <text font-size="12" class="sd-muted">
      <tspan x="48" y="364">Endpoints depend on services used.</tspan>
      <tspan x="48" y="384">Include gateway requirements for refresh.</tspan>
    </text>
    <rect
      x="392"
      y="318"
      width="344"
      height="82"
      rx="8"
      class="sd-card"
      stroke-width="1"
    ></rect>
    <text x="408" y="342" font-size="13" font-weight="700" class="sd-body">
      Monitoring and recovery
    </text>
    <text font-size="12" class="sd-muted">
      <tspan x="408" y="364">Record completed runs and checkpoints.</tspan>
      <tspan x="408" y="384">A successful run can copy zero new rows.</tspan>
    </text>
  </g>
</svg>
