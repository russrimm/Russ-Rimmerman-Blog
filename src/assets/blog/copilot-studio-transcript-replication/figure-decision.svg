<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 470"
  class="sd-root"
  role="img"
  aria-labelledby="ctDecisionTitle ctDecisionDesc"
>
  <title id="ctDecisionTitle">Choosing a transcript replication option</title>
  <desc id="ctDecisionDesc">
    Start by asking whether suitable Microsoft Fabric capacity already exists.
    If yes, evaluate Link to Fabric, including storage and compute headroom. If
    no, compare a custom collector with managed export alternatives. In both
    cases, decide retention, privacy, table eligibility, network access, report
    licensing, and operational ownership. Long-term history does not require a
    custom Function if an approved managed export meets the need.
  </desc>

  <text x="12" y="26" font-size="19" font-weight="700" class="sd-title">
    Choosing a transcript replication option
  </text>
  <text x="12" y="50" font-size="13" class="sd-muted">
    Start with capacity, then check retention, access, and ownership.
  </text>

  <!-- Primary question -->
  <g class="sd-blue">
    <rect
      x="12"
      y="76"
      width="736"
      height="56"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="32" y="100" font-size="14" font-weight="700" class="sd-fill">
      Start here
    </text>
    <text x="32" y="120" font-size="14" class="sd-body">
      Do you already have suitable Microsoft Fabric capacity?
    </text>
  </g>

  <!-- Branch connectors -->
  <path d="M 200 132 L 200 158" class="sd-rule" stroke-width="1.5"></path>
  <path d="M 560 132 L 560 158" class="sd-rule" stroke-width="1.5"></path>
  <polygon points="200,166 196,158 204,158" class="sd-arrowhead"></polygon>
  <polygon points="560,166 556,158 564,158" class="sd-arrowhead"></polygon>
  <text x="210" y="152" font-size="12" font-weight="700" class="sd-body">
    Yes
  </text>
  <text x="570" y="152" font-size="12" font-weight="700" class="sd-body">
    No
  </text>

  <!-- Yes branch -->
  <g class="sd-green">
    <rect
      x="12"
      y="168"
      width="356"
      height="132"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="32" y="194" font-size="14" font-weight="700" class="sd-fill">
      Evaluate Link to Fabric
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="32" y="220">Microsoft operates the sync service</tspan>
      <tspan x="32" y="242">Check compute and storage headroom</tspan>
      <tspan x="32" y="264">Confirm low-latency mode availability</tspan>
      <tspan x="32" y="286">You own parsing and reporting</tspan>
    </text>
  </g>

  <!-- No branch -->
  <g class="sd-purple">
    <rect
      x="392"
      y="168"
      width="356"
      height="132"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="412" y="194" font-size="14" font-weight="700" class="sd-fill">
      Compare export approaches
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="412" y="220">Function collector or managed export</tspan>
      <tspan x="412" y="242">Choose an approved destination</tspan>
      <tspan x="412" y="264">Budget the full reporting path</tspan>
      <tspan x="412" y="286">Assign an operational owner</tspan>
    </text>
  </g>

  <!-- Override -->
  <g class="sd-amber">
    <rect
      x="12"
      y="322"
      width="736"
      height="134"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"
    ></rect>
    <text x="32" y="348" font-size="14" font-weight="700" class="sd-fill">
      Required decisions for either path
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="32" y="374">Redact before storage when required</tspan>
      <tspan x="32" y="396">Keep history under an approved policy</tspan>
      <tspan x="32" y="418">Restrict raw and report access</tspan>
      <tspan x="404" y="374">Confirm table eligibility</tspan>
      <tspan x="404" y="396">Plan refresh connectivity and licenses</tspan>
      <tspan x="404" y="418">Monitor completion and recovery</tspan>
    </text>
    <text x="32" y="442" font-size="12" font-style="italic" class="sd-muted">
      A live replica alone is not an archive. Managed exports can support
      history too.
    </text>
  </g>
</svg>
