<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 466"
  class="sd-root"
  role="img"
  aria-labelledby="sreLifecycleTitle sreLifecycleDesc"
>
  <title id="sreLifecycleTitle">
    Automated incident lifecycle, from alert to resolution
  </title>
  <desc id="sreLifecycleDesc">
    Six sequential phases. One, fault: add to cart starts failing and
    availability drops below the target. Two, alert: Azure Monitor fires a Sev1
    alert on the breach. Three, ticket: a ServiceNow incident is created and the
    agent acknowledges it. Four, investigation: metrics look clean, but
    application logs show an out-of-memory exception, correlated against request
    volume. Five, mitigation: the agent rules out a platform fault and scales the
    app up with no human in the loop. Six, verification: metrics hold steady with
    no new server errors, so the agent closes the ticket with resolution notes.
    The recorded demo ran end to end in about fifteen minutes.
  </desc>

  <defs>
    <marker
      id="sreLifecycleArrow"
      markerWidth="9"
      markerHeight="9"
      refX="7"
      refY="3"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0 0 L7 3 L0 6 Z" class="sd-arrowhead"></path>
    </marker>
  </defs>

  <text x="12" y="26" font-size="19" font-weight="700" class="sd-title">
    One incident, end to end
  </text>
  <text x="12" y="50" font-size="13" class="sd-muted">
    The demo loop: breach detected, ticket opened, cause found, app scaled,
    recovery verified, ticket closed.
  </text>

  <!-- Connectors within row 1 -->
  <line
    x1="246"
    y1="151"
    x2="260"
    y2="151"
    class="sd-rule"
    stroke-width="1.5"
    marker-end="url(#sreLifecycleArrow)"></line>
  <line
    x1="498"
    y1="151"
    x2="512"
    y2="151"
    class="sd-rule"
    stroke-width="1.5"
    marker-end="url(#sreLifecycleArrow)"></line>

  <!-- Row 1 to row 2 -->
  <path
    d="M632 226 V242 H128 V258"
    class="sd-rule"
    stroke-width="1.5"
    stroke-linejoin="round"
    marker-end="url(#sreLifecycleArrow)"></path>

  <!-- Connectors within row 2 -->
  <line
    x1="246"
    y1="337"
    x2="260"
    y2="337"
    class="sd-rule"
    stroke-width="1.5"
    marker-end="url(#sreLifecycleArrow)"></line>
  <line
    x1="498"
    y1="337"
    x2="512"
    y2="337"
    class="sd-rule"
    stroke-width="1.5"
    marker-end="url(#sreLifecycleArrow)"></line>

  <!-- 1. Fault -->
  <g class="sd-red">
    <rect
      x="12"
      y="76"
      width="232"
      height="150"
      rx="12"
      class="sd-card"
      stroke-width="1.5"></rect>
    <circle cx="38" cy="104" r="13" class="sd-fill"></circle>
    <text
      x="38"
      y="109"
      font-size="13"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">1</text
    >
    <text x="60" y="109" font-size="13.5" font-weight="700" class="sd-title">
      Fault
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="32" y="146">Add to cart starts failing.</tspan>
      <tspan x="32" y="165">Availability drops below</tspan>
      <tspan x="32" y="184">the 95% target.</tspan>
    </text>
  </g>

  <!-- 2. Alert -->
  <g class="sd-red">
    <rect
      x="264"
      y="76"
      width="232"
      height="150"
      rx="12"
      class="sd-card"
      stroke-width="1.5"></rect>
    <circle cx="290" cy="104" r="13" class="sd-fill"></circle>
    <text
      x="290"
      y="109"
      font-size="13"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">2</text
    >
    <text x="312" y="109" font-size="13.5" font-weight="700" class="sd-title">
      Alert
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="284" y="146">Azure Monitor fires a</tspan>
      <tspan x="284" y="165">Sev1 alert on the breach.</tspan>
    </text>
  </g>

  <!-- 3. Ticket -->
  <g class="sd-amber">
    <rect
      x="516"
      y="76"
      width="232"
      height="150"
      rx="12"
      class="sd-card"
      stroke-width="1.5"></rect>
    <circle cx="542" cy="104" r="13" class="sd-fill"></circle>
    <text
      x="542"
      y="109"
      font-size="13"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">3</text
    >
    <text x="564" y="109" font-size="13.5" font-weight="700" class="sd-title">
      Ticket
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="536" y="146">A ServiceNow incident is</tspan>
      <tspan x="536" y="165">created. The agent</tspan>
      <tspan x="536" y="184">acknowledges it and</tspan>
      <tspan x="536" y="203">starts work.</tspan>
    </text>
  </g>

  <!-- 4. Investigation -->
  <g class="sd-amber">
    <rect
      x="12"
      y="262"
      width="232"
      height="150"
      rx="12"
      class="sd-card"
      stroke-width="1.5"></rect>
    <circle cx="38" cy="290" r="13" class="sd-fill"></circle>
    <text
      x="38"
      y="295"
      font-size="13"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">4</text
    >
    <text x="60" y="295" font-size="13.5" font-weight="700" class="sd-title">
      Investigation
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="32" y="332">Metrics look clean. Logs</tspan>
      <tspan x="32" y="351">show an out-of-memory</tspan>
      <tspan x="32" y="370">exception, correlated</tspan>
      <tspan x="32" y="389">against request volume.</tspan>
    </text>
  </g>

  <!-- 5. Mitigation -->
  <g class="sd-teal">
    <rect
      x="264"
      y="262"
      width="232"
      height="150"
      rx="12"
      class="sd-card"
      stroke-width="1.5"></rect>
    <circle cx="290" cy="290" r="13" class="sd-fill"></circle>
    <text
      x="290"
      y="295"
      font-size="13"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">5</text
    >
    <text x="312" y="295" font-size="13.5" font-weight="700" class="sd-title">
      Mitigation
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="284" y="332">It rules out a platform</tspan>
      <tspan x="284" y="351">fault and scales the app</tspan>
      <tspan x="284" y="370">up. No human in the loop.</tspan>
    </text>
  </g>

  <!-- 6. Verification -->
  <g class="sd-green">
    <rect
      x="516"
      y="262"
      width="232"
      height="150"
      rx="12"
      class="sd-card"
      stroke-width="1.5"></rect>
    <circle cx="542" cy="290" r="13" class="sd-fill"></circle>
    <text
      x="542"
      y="295"
      font-size="13"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">6</text
    >
    <text x="564" y="295" font-size="13.5" font-weight="700" class="sd-title">
      Verification
    </text>
    <text font-size="12" class="sd-body">
      <tspan x="536" y="332">Metrics hold steady with</tspan>
      <tspan x="536" y="351">no new 500s, so it closes</tspan>
      <tspan x="536" y="370">the ticket with resolution</tspan>
      <tspan x="536" y="389">notes.</tspan>
    </text>
  </g>

  <text x="12" y="444" font-size="12" class="sd-muted">
    Recorded during public preview. The demo ran end to end in about fifteen
    minutes.
  </text>
</svg>
